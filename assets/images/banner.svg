<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="eido-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040817" />
      <stop offset="50%" stop-color="#0B1736" />
      <stop offset="100%" stop-color="#02050E" />
    </linearGradient>
    <linearGradient id="base-mint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <radialGradient id="foundry-glow" cx="75%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#0052FF" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#10B981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#040817" stop-opacity="0" />
    </radialGradient>
    <pattern id="foundry-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#0052FF" stroke-width="0.5" stroke-opacity="0.06" />
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="url(#eido-bg)" />
  <rect width="1200" height="420" fill="url(#foundry-glow)" />
  <rect width="1200" height="420" fill="url(#foundry-grid)" />

  <rect x="20" y="20" width="1160" height="380" rx="14" fill="none" stroke="#0052FF" stroke-width="1" stroke-opacity="0.2" />

  <!-- Autonomous Foundry Pipeline Art (Right Side) -->
  <g transform="translate(850, 210)">
    <!-- Base Chain Glowing Ring -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="#0052FF" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="8 6" />
    <circle cx="0" cy="0" r="70" fill="#0D1E4A" stroke="#0052FF" stroke-width="2.5" />
    <!-- Base Blue Disc Core -->
    <circle cx="0" cy="0" r="38" fill="#0052FF" />
    <path d="M -16 0 L 16 0 M 0 -16 L 0 16" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />

    <!-- Autonomous Pipeline Nodes Orbiting Core -->
    <!-- Node 1: Ideate (Top) -->
    <g transform="translate(0, -115)">
      <rect x="-40" y="-16" width="80" height="32" rx="16" fill="#0E2459" stroke="#38BDF8" stroke-width="1.5" />
      <text x="0" y="4" fill="#38BDF8" font-family="'SF Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">IDEATE</text>
    </g>
    <!-- Node 2: Build & Sandbox (Right) -->
    <g transform="translate(115, 0)">
      <rect x="-35" y="-16" width="70" height="32" rx="16" fill="#0E2459" stroke="#10B981" stroke-width="1.5" />
      <text x="0" y="4" fill="#10B981" font-family="'SF Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">BUILD</text>
    </g>
    <!-- Node 3: Tokenize (Bottom) -->
    <g transform="translate(0, 115)">
      <rect x="-45" y="-16" width="90" height="32" rx="16" fill="#0E2459" stroke="#F59E0B" stroke-width="1.5" />
      <text x="0" y="4" fill="#F59E0B" font-family="'SF Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">TOKENIZE</text>
    </g>
    <!-- Node 4: Launch (Left) -->
    <g transform="translate(-115, 0)">
      <rect x="-40" y="-16" width="80" height="32" rx="16" fill="#0E2459" stroke="#EC4899" stroke-width="1.5" />
      <text x="0" y="4" fill="#EC4899" font-family="'SF Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">LAUNCH</text>
    </g>

    <text x="0" y="155" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11" letter-spacing="1" text-anchor="middle">FOUNDRY: FULL-LOOP AUTONOMOUS</text>
  </g>

  <!-- Content (Left Side) -->
  <g transform="translate(70, 75)">
    <rect width="240" height="30" rx="15" fill="#0052FF" fill-opacity="0.12" stroke="#0052FF" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="16" cy="15" r="4" fill="#0052FF" />
    <text x="28" y="19" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">AUTONOMOUS STARTUP FOUNDRY</text>

    <text x="0" y="85" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">
      EIDO
    </text>

    <rect x="0" y="105" width="85" height="4" rx="2" fill="url(#base-mint)" />

    <text x="0" y="150" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" letter-spacing="-0.2">
      AI agent discovering problems, building MVPs, deploying, and tokenizing on Base.
    </text>

    <text x="0" y="180" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Automated pipeline from raw idea to live product, Base L2 token, and social announcement.
    </text>

    <g transform="translate(0, 240)">
      <rect width="170" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
      <text x="14" y="22" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11">ORCHESTRATION: CREWAI</text>

      <rect x="185" y="0" width="180" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
      <text x="199" y="22" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11">BLOCKCHAIN: BASE L2</text>

      <rect x="380" y="0" width="160" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
      <text x="394" y="22" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11">SLA: 24H RESPONSE</text>
    </g>
  </g>
</svg>